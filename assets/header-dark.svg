<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Yongho Kwon</title>
  <desc id="d">Digital twins for manufacturing with Unreal Engine 5 and C++. AI-assisted development with coding agents. Web with React and JavaScript.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Helvetica, Arial, sans-serif; }
    .mono, .num { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .name { font-family: Georgia, "Times New Roman", "Noto Serif KR", serif; font-size: 76px; letter-spacing: -1px; fill: #ecebe7; }
    .handle { font-size: 13px; letter-spacing: 1.5px; fill: #93918b; }
    .bio { font-size: 19px; fill: #93918b; }
    .num { font-size: 15px; fill: #ff7a45; }
    .ttl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 21px; font-weight: 600; fill: #ecebe7; }
    .det { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 17px; fill: #93918b; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
  </style>
  <rect width="1200" height="300" rx="6" fill="#16171b"/>
  <text class="handle mono" x="64" y="76">GITHUB.COM/YONGHOKWON</text>
  <text class="name" x="60" y="166">Yongho Kwon<tspan fill="#ff7a45">.</tspan></text>
  <text class="bio sans" x="64" y="218">I want to be a nice developer!!<tspan class="caret mono" dx="6" fill="#ff7a45">_</tspan></text>
  <line x1="768" y1="68" x2="768" y2="258" stroke="#2e2f35" stroke-width="1"/>
    <text class="num" x="800" y="96">01</text>
    <text class="ttl" x="844" y="96">Digital Twin</text>
    <text class="det" x="844" y="122">Manufacturing · Unreal Engine 5 · C++</text>
    <text class="num" x="800" y="162">02</text>
    <text class="ttl" x="844" y="162">AI-assisted Dev</text>
    <text class="det" x="844" y="188">Coding agents · Claude · Codex</text>
    <text class="num" x="800" y="228">03</text>
    <text class="ttl" x="844" y="228">Web</text>
    <text class="det" x="844" y="254">React · JavaScript · HTML/CSS</text>
