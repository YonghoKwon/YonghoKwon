<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="t d">
  <title id="t">Yongho Kwon</title>
  <desc id="d">Digital twins for manufacturing with Unreal Engine 5 and C++. AI-assisted development with coding agents. Backend with Java and Spring Boot, web with React.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Helvetica, Arial, sans-serif; }
    .mono, .num { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .name { font-family: Georgia, "Times New Roman", "Noto Serif KR", serif; font-size: 76px; letter-spacing: -1px; fill: #1b1b1a; }
    .handle { font-size: 13px; letter-spacing: 1.5px; fill: #6f6d68; }
    .bio { font-size: 19px; fill: #6f6d68; }
    .num { font-size: 15px; fill: #d9480f; }
    .ttl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 21px; font-weight: 600; fill: #1b1b1a; }
    .det { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; fill: #6f6d68; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
  </style>
  <rect width="1000" height="320" rx="6" fill="#f6f5f1"/>
  <text class="handle mono" x="56" y="96">GITHUB.COM/YONGHOKWON</text>
  <text class="name" x="52" y="186">Yongho Kwon<tspan fill="#d9480f">.</tspan></text>
  <text class="bio sans" x="56" y="238">I want to be a nice developer!!<tspan class="caret mono" dx="6" fill="#d9480f">_</tspan></text>
