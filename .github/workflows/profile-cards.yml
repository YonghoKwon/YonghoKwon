# Generates the GitHub stats cards as static SVGs inside this repo,
# so the profile never depends on a rate-limited public stats server.
name: Update profile cards

on:
  schedule:
    - cron: "17 3 * * *" # daily, 12:17 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-cards.yml"
      - "README.md"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&custom_title=Activity&hide=stars,contribs&hide_rank=true&include_all_commits=true&hide_border=true&title_color=1b1b1a&text_color=6f6d68&bg_color=00000000
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&custom_title=Activity&hide=stars,contribs&hide_rank=true&include_all_commits=true&hide_border=true&title_color=ecebe7&text_color=93918b&bg_color=00000000
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&custom_title=Languages&langs_count=6&hide_border=true&title_color=1b1b1a&text_color=6f6d68&bg_color=00000000
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&custom_title=Languages&langs_count=6&hide_border=true&title_color=ecebe7&text_color=93918b&bg_color=00000000
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stack card (from public repos)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_stack.py ${{ github.repository_owner }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-light.svg?palette=github-light&color_snake=#d9480f
            profile/snake-dark.svg?palette=github-dark&color_snake=#ff7a45

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg assets/stack-*.svg
          git commit -m "chore(profile): update generated cards" || exit 0
          git push
